; Godot 安卓导出预设
;
; 关键取舍说明：
;   gradle_build/use_gradle_build = false
;       使用 Godot 自带的预编译 APK 模板，不进行 Gradle 构建。
;       好处：CI 里不需要装 Gradle、不需要下载 Gradle 依赖，构建快很多。
;       代价：不能用自定义安卓插件（Java/Kotlin 代码）。本项目不需要，所以选它。
;       将来要接安卓 SDK（比如广告、支付、推送）时，把这里改成 true，
;       并在 CI 里加上 gradle 相关步骤。
;
;   architectures/arm64-v8a = true，其余关闭
;       只出 64 位包。Google Play 要求 64 位，且 32 位手机现在已经很少了。
;       想在旧设备或模拟器上跑，把 armeabi-v7a / x86_64 打开即可。
;
;   下面只写了需要改动的选项，没写的全部走引擎默认值 —— 这样升级 Godot
;   版本时不容易因为选项改名而失效。

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
;   tools/ 里是无头自检脚本，只给开发者用（见 tools/selftest.gd）。
;   "all_resources" 会把它们一起塞进包体，白白占体积，所以在这里排掉。
exclude_filter="tools/*"
export_path="build/android/MobileFPS.apk"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=2
version/name="1.1.0"
package/unique_name="com.example.mobilefps"
package/name="MobileFPS"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()

; ---------------------------------------------------------------------------
; 第二个预设：Windows 桌面版
;   加这个是为了让你不用手机也能立刻试玩 —— 电脑上双击 exe 就能跑，
;   对着屏幕调手感比对着手机快得多。手机和电脑共用同一套代码和关卡。
;   binary_format/embed_pck=true 表示把游戏数据打包进 exe，
;   产出单个文件，不用附带 .pck，发给别人也方便。
; ---------------------------------------------------------------------------

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*"
export_path="build/windows/MobileFPS.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
;   注意 application/modify_resources 关掉了：
;   打开的话 Godot 会调用 rcedit 往 exe 里写图标和版本信息，
;   而 rcedit 在 Linux 上依赖 wine —— CI 构建机会因为缺 wine 而失败。
;   关掉它换来确定性，代价是 exe 用的是 Godot 默认图标。想要自定义图标，
;   就在你自己的 Windows 电脑上导出，或者在 CI 里装 wine。
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="MobileFPS"
application/file_description="手机第一人称射击模板（Windows 调试版）"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

